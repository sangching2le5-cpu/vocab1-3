<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Unit 1–3 — Learning App</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #4a7fd4; --primary-dark: #3665b0; --primary-soft: #e8f0fd;
  --bg: #f4f7fb; --card: #ffffff; --text: #1f2b3d; --muted: #64748b;
  --border: #e2e8f0; --border-strong: #cbd5e1;
  --green: #16a34a; --green-bg: #e9f9ef;
  --red: #dc2626; --red-bg: #fdecec;
  --amber: #d97706; --amber-bg: #fef3c7;
  --violet: #7c3aed; --violet-bg: #ede9fe;
  --shadow: 0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
  --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar { background: #fff; border-right: 1px solid var(--border); padding: 22px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { font-size: 17px; font-weight: 800; color: var(--primary-dark); padding: 0 10px 20px; letter-spacing: -.3px; }
.brand small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 3px; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; border: none; background: transparent; border-radius: 10px; font-size: 14.5px; font-weight: 600; color: var(--text); text-align: left; margin-bottom: 3px; transition: background .15s ease, color .15s ease; }
.nav-btn:hover { background: #f1f5fb; }
.nav-btn.active { background: var(--primary-soft); color: var(--primary-dark); }
.nav-btn .ico { font-size: 17px; width: 22px; text-align: center; }
.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }
.main { padding: 26px 32px 70px; max-width: 1200px; }
.page-title { font-size: 26px; letter-spacing: -.4px; margin-bottom: 6px; }
.page-sub { color: var(--muted); font-size: 14.5px; margin-bottom: 24px; }
.mobile-bar { display: none; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.dash-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; display: flex; flex-direction: column; gap: 8px; }
.dash-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: #d5e3f8; }
.dash-card .ico { font-size: 30px; }
.dash-card h3 { font-size: 17px; letter-spacing: -.2px; }
.dash-card p { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.dash-card .prog-line { font-size: 12.5px; font-weight: 700; color: var(--primary-dark); margin-top: 4px; }
.btn { border-radius: 10px; padding: 10px 16px; font-size: 14.5px; font-weight: 600; border: 1px solid transparent; transition: all .15s ease; white-space: nowrap; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn-ghost { background: #fff; color: var(--text); border-color: var(--border-strong); }
.btn-ghost:hover { background: #f1f5fb; }
.btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
.btn-danger:hover { background: #b91c1c; }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.full { width: 100%; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; align-items: center; }
.search-box { flex: 1; min-width: 200px; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14.5px; background: #fff; }
.search-box:focus { outline: none; border-color: var(--primary); }
select.filter { padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; background: #fff; cursor: pointer; }
select.filter:focus { outline: none; border-color: var(--primary); }
.chip { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s ease; }
.chip:hover { background: #f1f5fb; }
.chip.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dark); }
.vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.vocab-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px; position: relative; transition: all .15s ease; }
.vocab-card:hover { box-shadow: var(--shadow-sm); border-color: #c9dcf4; }
.vocab-card .word { font-size: 19px; font-weight: 800; color: var(--primary-dark); letter-spacing: -.3px; }
.vocab-card .ipa { color: var(--muted); font-size: 13px; margin: 3px 0 6px; }
.vocab-card .pos { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; background: var(--primary-soft); color: var(--primary-dark); padding: 3px 8px; border-radius: 999px; margin-bottom: 8px; }
.vocab-card .meaning { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.vocab-card .def { font-size: 13.5px; color: #475569; margin-bottom: 8px; line-height: 1.55; }
.vocab-card .ex { font-size: 13.5px; color: var(--muted); font-style: italic; padding-left: 10px; border-left: 3px solid var(--border); }
.vocab-actions { position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .15s ease; }
.icon-btn:hover { background: #f1f5fb; }
.icon-btn.on { background: var(--amber-bg); border-color: #fbbf24; }
.icon-btn.mastered { background: var(--green-bg); border-color: #86efac; }
.vocab-card.mastered { border-color: #86efac; background: linear-gradient(to bottom, #f0fdf4, #ffffff); }
.flash-wrap { max-width: 640px; margin: 0 auto; }
.flash-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 14px; color: var(--muted); }
.flash-progress .bar { flex: 1; height: 8px; background: #e8eef7; border-radius: 999px; overflow: hidden; }
.flash-progress .bar > div { height: 100%; background: linear-gradient(90deg, #6fa2ea, var(--primary)); transition: width .3s ease; }
.flash-card { background: #fff; border: 1px solid var(--border); border-radius: 20px; min-height: 320px; padding: 40px 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; box-shadow: var(--shadow); transition: transform .18s ease; position: relative; user-select: none; }
.flash-card:active { transform: scale(.99); }
.flash-card .front, .flash-card .back { width: 100%; }
.flash-card .f-word { font-size: 36px; font-weight: 800; color: var(--primary-dark); letter-spacing: -.8px; margin-bottom: 8px; }
.flash-card .f-ipa { font-size: 17px; color: var(--muted); margin-bottom: 14px; }
.flash-card .f-pos { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; background: var(--primary-soft); color: var(--primary-dark); padding: 5px 12px; border-radius: 999px; display: inline-block; }
.flash-card .hint { font-size: 12.5px; color: var(--muted); margin-top: 28px; }
.flash-card .b-meaning { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
.flash-card .b-def { font-size: 15px; color: #475569; margin-bottom: 16px; line-height: 1.6; }
.flash-card .b-ex { font-size: 14.5px; color: var(--muted); font-style: italic; padding: 12px 16px; background: #f7fafd; border-radius: 10px; border-left: 3px solid var(--primary); text-align: left; }
.flash-nav { display: flex; gap: 10px; margin-top: 20px; }
.flash-nav .btn { flex: 1; }
.flash-judge { display: flex; gap: 12px; margin-top: 16px; }
.flash-judge .btn { flex: 1; padding: 14px; font-size: 15px; }
.q-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 26px 28px; box-shadow: var(--shadow-sm); margin-bottom: 18px; }
.q-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; font-size: 12.5px; font-weight: 700; }
.q-meta .tag { padding: 4px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-dark); text-transform: uppercase; letter-spacing: .4px; }
.q-meta .tag.unit { background: var(--violet-bg); color: var(--violet); }
.q-meta .tag.part { background: var(--amber-bg); color: var(--amber); }
.q-text { font-size: 18px; font-weight: 600; line-height: 1.6; margin-bottom: 20px; color: #14243d; }
.q-text .blank { color: var(--primary); font-weight: 800; }
.q-options { display: flex; flex-direction: column; gap: 10px; }
.q-opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 12px; background: #fff; font-size: 15.5px; line-height: 1.5; color: var(--text); transition: all .15s ease; }
.q-opt:hover { background: #f7faff; border-color: #bcd3f3; }
.q-opt .letter { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: #eef3fb; color: #4a6080; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.q-opt.selected { background: var(--primary-soft); border-color: var(--primary); }
.q-opt.selected .letter { background: var(--primary); color: #fff; }
.q-opt.correct { background: var(--green-bg); border-color: #86efac; }
.q-opt.correct .letter { background: var(--green); color: #fff; }
.q-opt.wrong { background: var(--red-bg); border-color: #f3bcbc; }
.q-opt.wrong .letter { background: var(--red); color: #fff; }
.q-opt:disabled { cursor: default; }
.q-feedback { margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-size: 14.5px; line-height: 1.6; }
.q-feedback.ok { background: var(--green-bg); border-left: 4px solid var(--green); color: #14532d; }
.q-feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); color: #7f1d1d; }
.q-feedback strong { display: block; margin-bottom: 5px; font-size: 15px; }
.result-hero { text-align: center; padding: 30px 20px; background: #fff; border: 1px solid var(--border); border-radius: 18px; margin-bottom: 22px; box-shadow: var(--shadow-sm); }
.result-hero .big { font-size: 52px; font-weight: 800; color: var(--primary-dark); letter-spacing: -2px; line-height: 1.05; }
.result-hero .pct { font-size: 18px; font-weight: 700; color: var(--muted); margin: 6px 0 18px; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.stat-box { background: #f7fafd; border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; }
.stat-box .num { font-size: 24px; font-weight: 800; }
.stat-box .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-top: 4px; font-weight: 700; }
.stat-box.ok .num { color: var(--green); }
.stat-box.bad .num { color: var(--red); }
.progress-bar-lg { height: 12px; background: #e8eef7; border-radius: 999px; overflow: hidden; margin: 8px 0; }
.progress-bar-lg > div { height: 100%; background: linear-gradient(90deg, #6fa2ea, var(--primary)); border-radius: 999px; transition: width .4s ease; }
.prog-block { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
.prog-block h3 { font-size: 16px; margin-bottom: 12px; }
.prog-block .row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; color: var(--muted); }
.prog-block .row strong { color: var(--text); }
.unit-prog { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.unit-prog .u-name { width: 70px; font-weight: 700; font-size: 14px; }
.unit-prog .bar { flex: 1; height: 10px; background: #e8eef7; border-radius: 999px; overflow: hidden; }
.unit-prog .bar > div { height: 100%; background: var(--primary); border-radius: 999px; }
.unit-prog .pct-txt { width: 46px; text-align: right; font-size: 13px; font-weight: 700; color: var(--primary-dark); }
.history-item { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.history-item .date { color: var(--muted); font-size: 12.5px; }
.history-item .score { font-weight: 800; font-size: 16px; color: var(--primary-dark); }
.mistake-item { background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--red); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
.mistake-item.mastered { border-left-color: var(--green); background: linear-gradient(to right, #f0fdf4, #ffffff); }
.mistake-item .m-q { font-size: 15px; font-weight: 600; line-height: 1.55; margin: 8px 0 12px; }
.mistake-item .m-ans { font-size: 13.5px; }
.mistake-item .m-ans .correct { color: var(--green); font-weight: 700; }
.mistake-item .m-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.overlay.show { display: flex; }
.modal { background: #fff; border-radius: 18px; padding: 26px 26px 22px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(15,23,42,.28); }
.modal h3 { font-size: 19px; margin-bottom: 12px; }
.modal p { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-bottom: 18px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
.modal-actions .btn { flex: 1 1 auto; min-width: 110px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.checkbox-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; cursor: pointer; }
.checkbox-row input { width: 17px; height: 17px; cursor: pointer; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; padding-top: 56px; }
  .sidebar { position: fixed; top: 56px; left: 0; bottom: 0; width: 250px; z-index: 90; transform: translateX(-100%); transition: transform .25s ease; height: auto; padding-bottom: 20px; }
  .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,.1); }
  .mobile-bar { display: flex; position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #fff; border-bottom: 1px solid var(--border); align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100; }
  .mobile-bar .brand { padding: 0; font-size: 16px; }
  .menu-toggle { background: transparent; border: none; font-size: 22px; padding: 4px 8px; }
  .main { padding: 20px 16px 60px; }
  .page-title { font-size: 22px; }
  .vocab-grid, .dash-grid { grid-template-columns: 1fr; }
  .flash-card { min-height: 260px; padding: 30px 20px; }
  .flash-card .f-word { font-size: 28px; }
  .q-card { padding: 20px 18px; }
  .q-text { font-size: 16.5px; }
  .result-hero .big { font-size: 40px; }
}
.sidebar-backdrop { display: none; position: fixed; inset: 56px 0 0 0; background: rgba(15,23,42,.4); z-index: 80; }
.sidebar-backdrop.show { display: block; }
@media (min-width: 901px) { .sidebar-backdrop { display: none !important; } }
.empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty-state .big-ico { font-size: 46px; margin-bottom: 12px; }
.empty-state h3 { color: var(--text); font-size: 18px; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="app">
  <div class="mobile-bar">
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    <div class="brand">📚 Vocabulary</div>
    <div style="width:30px"></div>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">📚 Vocabulary <small>Unit 1–3 · Chapters 1–2</small></div>
    <button class="nav-btn active" data-page="home"><span class="ico">🏠</span> Dashboard</button>
    <button class="nav-btn" data-page="vocab"><span class="ico">📚</span> Vocabulary</button>
    <button class="nav-btn" data-page="flash"><span class="ico">🃏</span> Flashcards</button>
    <button class="nav-btn" data-page="practice"><span class="ico">✏️</span> Practice</button>
    <button class="nav-btn" data-page="test"><span class="ico">📝</span> Test</button>
    <button class="nav-btn" data-page="progress"><span class="ico">📊</span> Progress</button>
    <button class="nav-btn" data-page="mistakes"><span class="ico">❌</span> Mistakes</button>
    <div class="sidebar-footer">
      <button class="nav-btn" id="resetBtn"><span class="ico">🔄</span> Reset Progress</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

<script>
"use strict";

/* ============================================================
   1. VOCABULARY DATA — 48 words
   ============================================================ */
const VOCAB = [
  {word:"encourage", ipa:"/ɪnˈkʌrɪdʒ/", pos:"v.", vi:"khuyến khích", def:"to give someone confidence, for example, by letting them know that what they did is good", ex:"When things aren't going well, he encourages me.", unit:1, chap:1},
  {word:"hands-on", ipa:"/ˌhændzˈɒn/", pos:"adj.", vi:"thực hành trực tiếp", def:"actually doing a particular thing, rather than just talking about it or getting someone else to do it", ex:"Ninety-nine per cent of primary pupils now have hands-on experience of computers.", unit:1, chap:1},
  {word:"healthy", ipa:"/ˈhelθi/", pos:"adj.", vi:"khỏe mạnh, lành mạnh", def:"well and not suffering from any illness", ex:"Most of us need to exercise more to be healthy.", unit:1, chap:1},
  {word:"ingredients", ipa:"/ɪnˈɡriːdiənts/", pos:"n.", vi:"nguyên liệu", def:"things that are used to make something, especially all the different foods you use when you are cooking a particular dish", ex:"Mix together all the ingredients.", unit:1, chap:1},
  {word:"kitchen", ipa:"/ˈkɪtʃɪn/", pos:"n.", vi:"nhà bếp", def:"a room that is used for cooking and for household jobs such as washing dishes", ex:"She was in the kitchen preparing dinner for the family.", unit:1, chap:1},
  {word:"qualified", ipa:"/ˈkwɒlɪfaɪd/", pos:"adj.", vi:"có đủ trình độ/chuyên môn", def:"someone who has the skills or experience in order to work in a particular profession", ex:"There are not enough qualified teachers in the country.", unit:1, chap:1},
  {word:"recipe", ipa:"/ˈresəpi/", pos:"n.", vi:"công thức nấu ăn", def:"a document that describes how to cook something", ex:"He got a recipe for chocolate cake from the cookbook.", unit:1, chap:1},
  {word:"serve", ipa:"/sɜːv/", pos:"v.", vi:"phục vụ (đồ ăn, thức uống)", def:"to give someone food and drinks", ex:"Tonight the restaurant is serving a cold tomato soup.", unit:1, chap:1},
  {word:"add", ipa:"/æd/", pos:"v.", vi:"thêm vào", def:"to put something in or on the other thing, to increase, complete, or improve it", ex:"Add the cheese to the pasta sauce.", unit:1, chap:2},
  {word:"bake", ipa:"/beɪk/", pos:"v.", vi:"nướng (bánh)", def:"to cook in the oven without any extra liquid or fat", ex:"Bake the cake for 35 to 50 minutes.", unit:1, chap:2},
  {word:"check", ipa:"/tʃek/", pos:"v.", vi:"kiểm tra", def:"to make sure that something is correct", ex:"He checked that he had his room key.", unit:1, chap:2},
  {word:"cool", ipa:"/kuːl/", pos:"v.", vi:"làm nguội, nguội đi", def:"to become lower in temperature", ex:"I waited for the fan to cool the room.", unit:1, chap:2},
  {word:"melt", ipa:"/melt/", pos:"v.", vi:"làm tan chảy", def:"to change to a liquid, usually when heated", ex:"The snow had melted, but the lake was still frozen solid.", unit:1, chap:2},
  {word:"mix", ipa:"/mɪks/", pos:"v.", vi:"trộn, hòa trộn", def:"to stir or shake together, or combine in some other way, so that it becomes a single substance", ex:"It mixes easily with cold or hot water to make a tasty drink.", unit:1, chap:2},
  {word:"pour", ipa:"/pɔːr/", pos:"v.", vi:"đổ, rót", def:"to make a liquid flow steadily out of a container by holding the container at an angle", ex:"Heat the oil in a frying-pan, then pour in the egg mixture.", unit:1, chap:2},
  {word:"spray", ipa:"/spreɪ/", pos:"v.", vi:"phun, xịt", def:"to cover or scatter an area", ex:"Remember to spray the flowers with water twice a day.", unit:1, chap:2},
  {word:"beat", ipa:"/biːt/", pos:"v.", vi:"đánh bại", def:"to do better than someone in a competition", ex:"In yesterday's games, Switzerland beat the United States two-one.", unit:2, chap:1},
  {word:"champion", ipa:"/ˈtʃæmpiən/", pos:"n.", vi:"nhà vô địch", def:"someone who has won the first prize in a competition, contest, or fight", ex:"She is a champion boxer and wrestler.", unit:2, chap:1},

   ============================================================ */
const LS_KEY = "vocabApp_state_v1";
const defaultState = {
  favorites: [], mastered: [], flashKnown: {}, flashUnknown: {},
  mistakes: {}, practiceHistory: [], testHistory: [], lastStudy: null
};
let appState = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const p = JSON.parse(raw); return Object.assign({}, defaultState, p); }
  } catch(e) { console.warn(e); }
  return JSON.parse(JSON.stringify(defaultState));
}
function saveState() {
  appState.lastStudy = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(appState)); } catch(e) { console.warn(e); }
}
function resetProgress() { appState = JSON.parse(JSON.stringify(defaultState)); saveState(); }

   5. HELPERS
   ============================================================ */
const $ = (sel) => document.querySelector(sel);
const main = $("#main");
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleQuestion(q) {
  const correctText = q.opts[q.a];
  const shuffled = shuffle(q.opts);
  return { ...q, opts: shuffled, a: shuffled.indexOf(correctText) };
}
function pct(n, d) { return d ? Math.round((n / d) * 1000) / 10 : 0; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, "0");
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}

let vocabFilter = { search: "", unit: "all", chap: "all" };
function renderVocab() {
  const words = VOCAB.filter(v => {
    if (vocabFilter.unit !== "all" && v.unit !== +vocabFilter.unit) return false;
    if (vocabFilter.chap !== "all" && v.chap !== +vocabFilter.chap) return false;
    if (vocabFilter.search) {
      const s = vocabFilter.search.toLowerCase();
      if (!(v.word.toLowerCase().includes(s) || v.vi.toLowerCase().includes(s) || v.def.toLowerCase().includes(s) || v.ipa.toLowerCase().includes(s))) return false;
    }
    return true;
  });
  main.innerHTML = `
    <h1 class="page-title">📚 Vocabulary</h1>
    <p class="page-sub">${VOCAB.length} words · Unit 1–3</p>
    <div class="toolbar">
      <input id="vocabSearch" class="search-box" type="text" placeholder="🔍 Search word, meaning, IPA..." value="${escapeHtml(vocabFilter.search)}">
      <select id="vocabUnit" class="filter"><option value="all">All Units</option><option value="1" ${vocabFilter.unit==="1"?"selected":""}>Unit 1</option><option value="2" ${vocabFilter.unit==="2"?"selected":""}>Unit 2</option><option value="3" ${vocabFilter.unit==="3"?"selected":""}>Unit 3</option></select>
      <select id="vocabChap" class="filter"><option value="all">All Chapters</option><option value="1" ${vocabFilter.chap==="1"?"selected":""}>Chapter 1</option><option value="2" ${vocabFilter.chap==="2"?"selected":""}>Chapter 2</option></select>
    </div>
    <div class="vocab-grid" id="vocabGrid">${words.length === 0 ? `<div class="empty-state" style="grid-column:1/-1"><div class="big-ico">🔍</div><h3>No words found</h3><p>Try a different search or filter.</p></div>` : words.map(v => vocabCardHtml(v)).join("")}</div>`;
  $("#vocabSearch").addEventListener("input", e => { vocabFilter.search = e.target.value; renderVocab(); });
  $("#vocabUnit").addEventListener("change", e => { vocabFilter.unit = e.target.value; renderVocab(); });
  $("#vocabChap").addEventListener("change", e => { vocabFilter.chap = e.target.value; renderVocab(); });
  document.querySelectorAll(".icon-btn[data-fav]").forEach(b => b.addEventListener("click", () => toggleFav(b.dataset.fav)));
  document.querySelectorAll(".icon-btn[data-master]").forEach(b => b.addEventListener("click", () => toggleMaster(b.dataset.master)));
}
function vocabCardHtml(v) {
  const isFav = appState.favorites.includes(v.word);
  const isMastered = appState.mastered.includes(v.word);
  return `<div class="vocab-card ${isMastered ? "mastered" : ""}">
    <div class="vocab-actions">
      <button class="icon-btn ${isFav?"on":""}" data-fav="${escapeHtml(v.word)}" title="Favorite">${isFav?"★":"☆"}</button>
      <button class="icon-btn ${isMastered?"mastered":""}" data-master="${escapeHtml(v.word)}" title="Mastered">${isMastered?"✓":"○"}</button>
    </div>
    <div class="word">${escapeHtml(v.word)}</div>
    <div class="ipa">${escapeHtml(v.ipa)}</div>
    <span class="pos">${escapeHtml(v.pos)}</span>
    <div class="meaning">${escapeHtml(v.vi)}</div>
    <div class="def">${escapeHtml(v.def)}</div>
    <div class="ex">"${escapeHtml(v.ex)}"</div>
  </div>`;
}
function toggleFav(word) { const i = appState.favorites.indexOf(word); if (i >= 0) appState.favorites.splice(i, 1); else appState.favorites.push(word); saveState(); renderVocab(); }
function toggleMaster(word) { const i = appState.mastered.indexOf(word); if (i >= 0) appState.mastered.splice(i, 1); else appState.mastered.push(word); saveState(); renderVocab(); }

let flashState = { deck: [], index: 0, flipped: false, filterUnit: "all" };
function buildFlashDeck() {
  let list = VOCAB.filter(v => flashState.filterUnit === "all" || v.unit === +flashState.filterUnit);
  flashState.deck = shuffle(list); flashState.index = 0; flashState.flipped = false;
}
function renderFlash() {
  if (flashState.deck.length === 0) buildFlashDeck();
  const total = flashState.deck.length;
  const card = flashState.deck[flashState.index];
  main.innerHTML = `
    <h1 class="page-title">🃏 Flashcards</h1>
    <p class="page-sub">Click the card to reveal the meaning</p>
    <div class="flash-wrap">
      <div class="toolbar">
        <select id="flashUnit" class="filter"><option value="all" ${flashState.filterUnit==="all"?"selected":""}>All Units</option><option value="1" ${flashState.filterUnit==="1"?"selected":""}>Unit 1</option><option value="2" ${flashState.filterUnit==="2"?"selected":""}>Unit 2</option><option value="3" ${flashState.filterUnit==="3"?"selected":""}>Unit 3</option></select>
        <button class="btn btn-ghost btn-sm" id="flashShuffle">🔀 Shuffle</button>
        <button class="btn btn-ghost btn-sm" id="flashRestart">↺ Restart</button>
      </div>
      <div class="flash-progress"><span>${flashState.index+1} / ${total}</span><div class="bar"><div style="width:${pct(flashState.index+1, total)}%"></div></div><span>${appState.mastered.length}/${VOCAB.length} mastered</span></div>
      <div class="flash-card" id="flashCard">
        ${flashState.flipped ? `<div class="back"><div class="b-meaning">${escapeHtml(card.vi)}</div><div class="b-def">${escapeHtml(card.def)}</div><div class="b-ex">"${escapeHtml(card.ex)}"</div></div>` : `<div class="front"><div class="f-word">${escapeHtml(card.word)}</div><div class="f-ipa">${escapeHtml(card.ipa)}</div><span class="f-pos">${escapeHtml(card.pos)}</span><div class="hint">Click to flip →</div></div>`}
      </div>
      <div class="flash-judge"><button class="btn btn-ghost" id="flashNo">✕ I don't know</button><button class="btn btn-primary" id="flashYes">✓ I know</button></div>
      <div class="flash-nav"><button class="btn btn-ghost" id="flashPrev" ${flashState.index===0?"disabled":""}>← Previous</button><button class="btn btn-ghost" id="flashNext" ${flashState.index>=total-1?"disabled":""}>Next →</button></div>
    </div>`;
  $("#flashCard").addEventListener("click", () => { flashState.flipped = !flashState.flipped; renderFlash(); });
  $("#flashYes").addEventListener("click", () => {
    appState.flashKnown[card.word] = true; delete appState.flashUnknown[card.word];
    if (!appState.mastered.includes(card.word)) appState.mastered.push(card.word);
    saveState(); nextFlash();
  });
  $("#flashNo").addEventListener("click", () => {
    appState.flashUnknown[card.word] = (appState.flashUnknown[card.word] || 0) + 1;
    delete appState.flashKnown[card.word];
    const i = appState.mastered.indexOf(card.word); if (i >= 0) appState.mastered.splice(i, 1);
    saveState(); nextFlash();
  });
  $("#flashPrev").addEventListener("click", () => { if (flashState.index > 0) { flashState.index--; flashState.flipped = false; renderFlash(); } });
  $("#flashNext").addEventListener("click", nextFlash);
  $("#flashShuffle").addEventListener("click", () => { buildFlashDeck(); renderFlash(); });
  $("#flashRestart").addEventListener("click", () => { flashState.index = 0; flashState.flipped = false; renderFlash(); });
  $("#flashUnit").addEventListener("change", e => { flashState.filterUnit = e.target.value; buildFlashDeck(); renderFlash(); });
}
function nextFlash() {
  if (flashState.index < flashState.deck.length - 1) { flashState.index++; flashState.flipped = false; renderFlash(); }
  else {
    openModal(`<h3>🎉 Session complete!</h3><p>You've reviewed all cards in this session. You mastered ${appState.mastered.length} out of ${VOCAB.length} words so far.</p>
      <div class="modal-actions"><button class="btn btn-ghost" id="mRestart">Restart</button><button class="btn btn-primary" id="mClose">Close</button></div>`);
    $("#mRestart").addEventListener("click", () => { closeModal(); flashState.index = 0; flashState.flipped = false; renderFlash(); });
    $("#mClose").addEventListener("click", closeModal);
  }
}

function startPracticeFrom(filterFn, count) {
  let pool = QUESTIONS.filter(filterFn);

          if (revealed) { if (i === q.a) cls += " correct"; else if (i === sel) cls += " wrong"; }
          else if (sel === i) cls += " selected";
          return `<button class="${cls}" data-i="${i}" ${revealed ? "disabled" : ""}><span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span></button>`;
        }).join("")}
      </div>
      ${revealed ? `<div class="q-feedback ${sel === q.a ? "ok" : "bad"}"><strong>${sel === q.a ? "🟢 Correct!" : "🔴 Incorrect"}</strong>${sel !== q.a ? `Correct answer: <b>${String.fromCharCode(65+q.a)}. ${escapeHtml(q.opts[q.a])}</b><br>` : ""}<span style="color:#475569">${escapeHtml(q.ex)}</span></div>` : ""}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-ghost" id="pracPrev" ${practiceState.index===0?"disabled":""}>← Previous</button>

    </div>`;
  document.querySelectorAll(".q-opt:not([disabled])").forEach(b => b.addEventListener("click", () => { practiceState.answers[practiceState.index] = +b.dataset.i; renderPracticeRunner(); }));
  $("#pracExit").addEventListener("click", () => { practiceState.active = false; renderPractice(); });
  $("#pracPrev").addEventListener("click", () => { if (practiceState.index > 0) { practiceState.index--; renderPracticeRunner(); } });
  const chk = $("#pracCheck");
  if (chk) chk.addEventListener("click", () => {
    practiceState.revealed[practiceState.index] = true;
    const q2 = practiceState.questions[practiceState.index];
    const s = practiceState.answers[practiceState.index];
    if (s !== q2.a) {
      const m = appState.mistakes[q2.id] || { wrongCount: 0, lastDate: null, mastered: false };
      m.wrongCount++; m.lastDate = new Date().toISOString(); m.mastered = false;
      appState.mistakes[q2.id] = m;
    } else { if (appState.mistakes[q2.id]) appState.mistakes[q2.id].mastered = true; }
    saveState(); renderPracticeRunner();
  });
  const nxt = $("#pracNextQ");
  if (nxt) nxt.addEventListener("click", () => { if (practiceState.index === total - 1) finishPractice(); else { practiceState.index++; renderPracticeRunner(); } });
}
function finishPractice() {
  const total = practiceState.questions.length;
  let correct = 0, wrong = 0, unanswered = 0;
  practiceState.questions.forEach((q, i) => {
    const sel = practiceState.answers[i];
    if (sel === undefined) unanswered++;
    else if (sel === q.a) correct++;
    else wrong++;
  });
  const accuracy = pct(correct, total);
  appState.practiceHistory.unshift({ date: new Date().toISOString(), total, correct, wrong, unanswered, accuracy });
  if (appState.practiceHistory.length > 30) appState.practiceHistory = appState.practiceHistory.slice(0, 30);
  saveState();
  practiceState.active = false;
  main.innerHTML = `

    </div>`;

    const wrongQs = practiceState.questions.filter((q, i) => practiceState.answers[i] !== undefined && practiceState.answers[i] !== q.a);

    practiceState.index = 0; practiceState.answers = {}; practiceState.revealed = {}; practiceState.active = true;

  });
  $("#pracRetryAll").addEventListener("click", () => {
    practiceState.questions = shuffle(QUESTIONS).slice(0, practiceState.questions.length).map(shuffleQuestion);
    practiceState.index = 0; practiceState.answers = {}; practiceState.revealed = {}; practiceState.active = true;
    renderPracticeRunner();
  });
  $("#pracBack").addEventListener("click", () => navigate("home"));
}

function startTest() {
  const count = +$("#tCount").value;

  const units = Array.from(document.querySelectorAll(".tUnit:checked")).map(c => +c.value);
  const timeLimit = +$("#tTime").value;
  if (types.length === 0 || units.length === 0) {
    openModal(`<h3>Please select at least one</h3><p>You need to select at least one question type and one unit.</p>
      <div class="modal-actions"><button class="btn btn-primary" id="mOk2">OK</button></div>`);
    $("#mOk2").addEventListener("click", closeModal);
    return;
  }
  let pool = QUESTIONS.filter(q => types.includes(q.part) && units.includes(q.unit));
  if (pool.length === 0) {
    openModal(`<h3>No questions match</h3><p>Try a different combination of types and units.</p>
      <div class="modal-actions"><button class="btn btn-primary" id="mOk3">OK</button></div>`);
    $("#mOk3").addEventListener("click", closeModal);
    return;
  }
  pool = shuffle(pool);
  testState.questions = pool.slice(0, Math.min(count, pool.length)).map(shuffleQuestion);
  testState.answers = {}; testState.index = 0; testState.startTime = Date.now(); testState.timeLimit = timeLimit * 60; testState.active = true;
  if (testState.timerId) clearInterval(testState.timerId);

      const elapsed = Math.floor((Date.now() - testState.startTime) / 1000);

        if (left <= 0) { clearInterval(testState.timerId); finishTest(); }
        else { const m = String(Math.floor(left / 60)).padStart(2, "0"); const s = String(left % 60).padStart(2, "0"); el.textContent = `⏱ ${m}:${s}`; if (left < 60) el.style.color = "var(--red)"; }
      }
    }, 500);
  }
  renderTestRunner();
}
function renderTestRunner() {
  const q = testState.questions[testState.index];

          <div class="m-ans">Correct answer: <span class="correct">${String.fromCharCode(65+q.a)}. ${escapeHtml(q.opts[q.a])}</span></div>
          <div style="font-size:13.5px;color:#475569;margin-top:8px">${escapeHtml(q.ex)}</div>
          <div class="m-meta">Last attempted: ${m.lastDate ? formatDate(m.lastDate) : "—"}</div>
        </div>`).join("")}
    `}`;
  const btn = $("#practiceMistakes");
  if (btn) btn.addEventListener("click", () => {
    const wrongQs = items.map(x => x.q);
    if (wrongQs.length === 0) return;
    practiceState.questions = shuffle(wrongQs).map(shuffleQuestion);
    practiceState.index = 0; practiceState.answers = {}; practiceState.revealed = {}; practiceState.active = true;
    navigate("practice");
  });
}

/* ============================================================
   14. INIT
   ============================================================ */
navigate("home");
</script>
</body>
</html>
